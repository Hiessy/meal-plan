<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5a3e2b">
  <meta name="description" content="Family meal plan for May 2026 — lunch, snack and dinner for 4, with recipes, Sunday prep and weekly shopping lists.">
  <title>Family Meal Plan — May 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽</text></svg>">
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<header>
  <button class="lang-btn" id="lang-btn" type="button" onclick="toggleLang()" data-tip-key="tipLang">🌐 Español</button>
  <h1 data-i18n="pageTitle">Family Meal Plan — May 2026</h1>
  <p data-i18n="subtitle">4 people · Lunch + Afternoon Snack + Dinner · Monday–Friday</p>
</header>

<nav class="tabs" id="tabs-nav" aria-label="Weeks"></nav>

<main>
  <div class="hint" id="hint" hidden>
    <span id="hint-text"></span>
    <button class="hint-close" type="button" onclick="dismissHint()" data-tip-key="tipHintClose" data-label>✕</button>
  </div>

  <div id="w1" class="week-section active"></div>
  <div id="w2" class="week-section"></div>
  <div id="w3" class="week-section"></div>
  <div id="w4" class="week-section"></div>
</main>

<footer class="site-footer" data-i18n="footer">Prices are estimates. Your ticks and settings are saved only in this browser.</footer>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-name">
    <div class="modal-head">
      <div>
        <div class="modal-meta" id="m-meta"></div>
        <h2 id="m-name"></h2>
      </div>
      <button class="modal-close" id="m-close" type="button" onclick="closeModal()" data-tip-key="tipClose" data-label>✕</button>
    </div>
    <div class="modal-body" id="m-body">
      <h3><span data-i18n="ingredients">Ingredients</span> <small data-i18n="serves">(serves 4)</small></h3>
      <ul id="m-ing"></ul>
      <h3><span data-i18n="steps">Steps</span></h3>
      <ol id="m-steps"></ol>
      <div class="tip-box" id="m-tip" hidden></div>
    </div>
    <div class="modal-foot">
      <button class="nav-btn" id="m-prev" type="button" onclick="stepModal(-1)">‹ <span data-i18n="prev">Previous</span></button>
      <span class="modal-pos" id="m-pos"></span>
      <button class="nav-btn" id="m-next" type="button" onclick="stepModal(1)"><span data-i18n="next">Next</span> ›</button>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js?v=3"></script>
<script src="prices.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
