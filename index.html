function showWeek(n){
  document.querySelectorAll('.week-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('w'+n).classList.add('active');
  document.querySelectorAll('.tab-btn')[n-1].classList.add('active');
}

function openModal(wk,day,mealIdx){
  const d=data[wk].days[day].meals[mealIdx];
  document.getElementById('m-name').textContent=d.name;
  document.getElementById('m-meta').textContent=
    (d.type==='lunch'?'🥗 Lunch':(d.type==='snack'?'🍎 Afternoon Snack':'🍽 Dinner'))+' · Serves 4';
  const ingEl=document.getElementById('m-ing');
  ingEl.innerHTML=d.ing.map(i=>`<li>${i}</li>`).join('');
  const stepsEl=document.getElementById('m-steps');
  stepsEl.innerHTML=d.steps.map(s=>`<li>${s}</li>`).join('');
  const tipEl=document.getElementById('m-tip');
  if(d.tip){tipEl.textContent='💚 '+d.tip;tipEl.style.display='block';}
  else{tipEl.style.display='none';}
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(e){
  if(e&&e.target!==document.getElementById('modal'))return;
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

function toggleShopping(n){
  const btn=document.querySelector(`#shop-toggle-${n}`);
  const body=document.querySelector(`#shop-body-${n}`);
  btn.classList.toggle('open');
  body.classList.toggle('open');
}

function buildWeek(n){
  const w=data[n];
  const section=document.getElementById('w'+n);
  const mealTypes={lunch:{badge:'badge-lunch',label:'Lunch',icon:'🥗'},snack:{badge:'badge-snack',label:'Snack',icon:'🍎'},dinner:{badge:'badge-dinner',label:'Dinner',icon:'🍽'}};
  const daysHtml=w.days.map((day,di)=>{
    const mealsHtml=day.meals.map((meal,mi)=>{
      const mt=mealTypes[meal.type];
      return `<div class="meal-slot" onclick="openModal(${n},${di},${mi})" title="Click for recipe & steps">
        <span class="meal-badge ${mt.badge}">${mt.icon} ${mt.label}</span>
        <div class="meal-name">${meal.name}</div>
        <div class="meal-hint">Tap for recipe →</div>
      </div>`;
    }).join('');
    return `<div class="day-col">
      <div class="day-header">${day.name}<span>${day.date}</span></div>
      ${mealsHtml}
    </div>`;
  }).join('');
  const shopCats=w.shopping.map(cat=>`
    <div class="shop-cat">
      <h4>${cat.cat}</h4>
      <ul>${cat.items.map(i=>`<li>${i}</li>`).join('')}</ul>
    </div>`).join('');
  section.innerHTML=`
    <h2 class="week-header">${w.title} &nbsp;·&nbsp; ${w.dates}</h2>
    <div class="sunday-prep">
      <h3>📋 ${w.prep.date}</h3>
      <ul>${w.prep.tasks.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>
    <div class="calendar">${daysHtml}</div>
    <div class="shopping-section">
      <div class="shopping-toggle" id="shop-toggle-${n}" onclick="toggleShopping(${n})">
        <h3>🛒 Weekly Shopping List — ${w.title}</h3>
        <span class="arrow">▼</span>
      </div>
      <div class="shopping-body" id="shop-body-${n}">
        <div class="shop-grid">${shopCats}</div>
      </div>
    </div>`;
}

[1,2,3,4].forEach(buildWeek);
</script>
</body>
</html>
