<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5a3e2b">
  <meta name="description" content="Family meal planner — a balanced random weekly menu of breakfast, lunch, snack and dinner for 4, with recipes, Sunday prep and a shopping list built from the week’s meals.">
  <title>Family Meal Plan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽</text></svg>">
  <!-- UI, then the optional flashy layer (motion, sound button) -->
  <link rel="stylesheet" href="css/ui.css?v=19">
  <link rel="stylesheet" href="css/fx.css?v=19">
</head>
<body>

<header>
  <button class="lang-btn" id="lang-btn" type="button" data-action="lang" data-tip-key="tipLang">🌐 Español</button>
  <h1 data-i18n="pageTitle">Family Meal Plan</h1>
  <p data-i18n="subtitle">4 people · Breakfast + Lunch + Afternoon Snack + Dinner · Monday–Friday</p>
  <p class="header-dates" id="header-dates"></p>
</header>

<nav class="tabs" id="tabs-nav" aria-label="Weeks"></nav>

<main>
  <div class="plan-bar" id="plan-bar"></div>

  <div class="hint" id="hint" hidden>
    <span id="hint-text"></span>
    <button class="hint-close" type="button" data-action="hide-hint" data-tip-key="tipHintClose" data-label>✕</button>
  </div>

  <div id="w1" class="week-section active"></div>
  <div id="w2" class="week-section"></div>
  <div id="w3" class="week-section"></div>
  <div id="w4" class="week-section"></div>
</main>

<footer class="site-footer" data-i18n="footer"></footer>

<div class="modal-overlay" id="modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-name">
    <div class="modal-head">
      <div>
        <div class="modal-meta">
          <span class="modal-when" id="m-meta"></span>
          <button class="swap-btn" id="m-swap" type="button" data-action="swap"></button>
        </div>
        <h2 id="m-name"></h2>
      </div>
      <button class="modal-close" id="m-close" type="button" data-action="close" data-tip-key="tipClose" data-label>✕</button>
    </div>
    <div class="modal-body" id="m-body">
      <h3><span data-i18n="ingredients">Ingredients</span> <small data-i18n="serves">(serves 4)</small></h3>
      <ul id="m-ing"></ul>
      <h3><span data-i18n="steps">Steps</span></h3>
      <ol id="m-steps"></ol>
      <div class="tip-box" id="m-tip" hidden></div>
      <div class="diet-box" id="m-diet" hidden></div>
    </div>
    <div class="modal-foot">
      <button class="nav-btn" id="m-prev" type="button" data-action="step" data-step="-1">‹ <span data-i18n="prev">Previous</span></button>
      <span class="modal-pos" id="m-pos"></span>
      <button class="nav-btn" id="m-next" type="button" data-action="step" data-step="1"><span data-i18n="next">Next</span> ›</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="panel">
  <div class="modal panel" role="dialog" aria-modal="true" aria-labelledby="p-title">
    <div class="modal-head">
      <div>
        <h2 id="p-title" data-i18n="panelTitle">Choose the recipes</h2>
        <p class="panel-intro" data-i18n="panelIntro"></p>
      </div>
      <button class="modal-close" id="p-close" type="button" data-action="close-panel" data-tip-key="tipClose" data-label>✕</button>
    </div>
    <div class="panel-tools">
      <input class="panel-search" id="p-search" type="search" autocomplete="off" spellcheck="false">
      <div class="panel-row" id="p-row"></div>
    </div>
    <div class="modal-body">
      <section class="filters" id="p-filters"></section>
      <div id="p-list"></div>
    </div>
    <div class="modal-foot">
      <span class="modal-pos" id="p-count"></span>
      <button class="nav-btn" type="button" data-action="close-panel" data-i18n="done">Done</button>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Meals & recipes -->
<script src="data/recipes.js?v=19"></script>
<script src="data/recipes-world.js?v=19"></script>
<script src="data/recipes-ai.js?v=19"></script>
<script src="data/ingredients.js?v=19"></script>
<script src="data/countries.js?v=19"></script>
<script src="data/diets.js?v=19"></script>
<!-- Logic: balanced menus, shopping & prep lists -->
<script src="js/planner.js?v=19"></script>
<script src="js/lists.js?v=19"></script>
<script src="js/diets.js?v=19"></script>
<!-- UI -->
<script src="js/i18n.js?v=19"></script>
<script src="js/tooltip.js?v=19"></script>
<script src="js/ui.js?v=19"></script>
<!-- Flashy layer: sounds and motion (optional) -->
<script src="js/fx.js?v=19"></script>
<script src="js/fx-scenes.js?v=19"></script>
</body>
</html>
