<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Meal Plan — May 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <button class="lang-btn" id="lang-btn" onclick="toggleLang()">🌐 Español</button>
  <h1 data-i18n="pageTitle">Family Meal Plan — May 2026</h1>
  <p data-i18n="subtitle">4 people · Lunch + Afternoon Snack + Dinner · Monday–Friday</p>
</header>

<nav class="tabs" id="tabs-nav"></nav>

<main>
  <div id="w1" class="week-section active"></div>
  <div id="w2" class="week-section"></div>
  <div id="w3" class="week-section"></div>
  <div id="w4" class="week-section"></div>
</main>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2 id="m-name"></h2>
    <div class="modal-meta" id="m-meta"></div>
    <h3><span data-i18n="ingredients">Ingredients</span></h3>
    <ul id="m-ing"></ul>
    <h3><span data-i18n="steps">Steps</span></h3>
    <ol id="m-steps"></ol>
    <div class="tip-box" id="m-tip" style="display:none"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
